name: evaluation-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: evaluation-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Require committed evaluation contract lock
        run: |
          set -euo pipefail
          if [ ! -f graderprobe.lock.json ]; then
            echo "graderprobe.lock.json is required. Generate it from a clean, committed revision with: graderprobe lock . --task-root corpus/tasks --out graderprobe.lock.json --anchors 2" >&2
            exit 2
          fi
      - name: Verify evaluation contract lock
        run: |
          set +e
          graderprobe verify-lock . --lock graderprobe.lock.json --workers 1 --execution-slots 1 > graderprobe-lock-result.json
          rc=$?
          cat graderprobe-lock-result.json
          exit $rc
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graderprobe-contract-lock
          path: graderprobe-lock-result.json
