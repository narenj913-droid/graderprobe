[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graderprobe"
version = "0.8.0"
description = "Counterfactual boundary testing for AI evaluators and benchmark graders."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "GraderProbe authors" }]
keywords = ["evaluation", "benchmarks", "metamorphic-testing", "counterfactual", "graders"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pyyaml==6.0.2", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
graderprobe = "graderprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graderprobe = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
